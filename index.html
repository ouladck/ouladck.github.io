<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karim Oulad Chalha - Creative Developer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="terminal">
            <div class="terminal-header">
                <div class="terminal-buttons">
                    <span class="terminal-button red"></span>
                    <span class="terminal-button yellow"></span>
                    <span class="terminal-button green"></span>
                </div>
                <div class="terminal-title">
                    /home/karim
                </div>
            </div>
            <div class="terminal-body">
                <div class="terminal-line">
                    <span class="prompt">></span> <span class="command" id="typewriter"></span>
                </div>
                <div class="skills-section">
                    <h2>My Arsenal</h2>
                    <div class="skills-grid">
                        <div class="skill-card">
                            <div class="skill-icon">
                                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/typescript/typescript-original.svg" alt="TypeScript">
                            </div>
                            <h3>TypeScript</h3>
                        </div>
                        <div class="skill-card">
                            <div class="skill-icon">
                                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/vuejs/vuejs-original.svg" alt="Vue 3">
                            </div>
                            <h3>Vue 3</h3>
                        </div>
                        <div class="skill-card">
                            <div class="skill-icon">
                                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/vitest/vitest-original.svg" alt="Vitest">
                            </div>
                            <h3>Vitest</h3>
                        </div>
                        <div class="skill-card">
                            <div class="skill-icon">
                                <img src="https://playwright.dev/img/playwright-logo.svg" alt="Playwright">
                            </div>
                            <h3>Playwright</h3>
                        </div>
                        <div class="skill-card">
                            <div class="skill-icon">
                                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/atom/atom-original.svg" alt="TDD">
                            </div>
                            <h3>TDD</h3>
                        </div>
                        <div class="skill-card">
                            <div class="skill-icon">
                                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/sass/sass-original.svg" alt="Sass">
                            </div>
                            <h3>Sass</h3>
                        </div>
                    </div>
                </div>
                 <div class="terminal-line">
                    <span class="prompt">></span> <span class="command">./contact</span>
                </div>
                 <div class="terminal-line">
                     <div class="social-links">
                        <a href="https://github.com/ouladck" target="_blank">GitHub</a>
                        <a href="https://www.linkedin.com/in/karim-oulad-chalha/" target="_blank">LinkedIn</a>
                    </div>
                </div>
                 <div class="terminal-line">
                    <span class="prompt">></span>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
